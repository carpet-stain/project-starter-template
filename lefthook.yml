# This repo's own lefthook jobs — not the templates it hosts. A single
# file: unlike git-flow/template's base/lang split (the real composition
# mechanism a *generated* repo needs to layer a language overlay without
# editing the base), this repo has no overlay of its own to compose with,
# so the split bought nothing here — it was just an artifact of
# bootstrapping from the git-flow base (#10). The `base` tag stays on every
# job below since lint.yml's CI job selects it via `just lint --tag base`.
# Install with `lefthook install`.
pre-commit:
  jobs:
    - name: actionlint
      tags: [base]
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: actionlint {staged_files}

    - name: md-format
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: prettier --check {staged_files}

    - name: markdownlint
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: markdownlint-cli2 {staged_files}

    - name: yaml-format
      tags: [base]
      glob:
        - ".github/dependabot.yml"
        - ".markdownlint-cli2.yaml"
        - "lefthook.yml"
      run: yamlfmt -lint {staged_files}

    - name: gitleaks
      tags: [base]
      # No glob/{staged_files}: gitleaks is content-based and must cover
      # .claude/agent-memory/** — don't copy the markdown jobs' excludes. dotfiles#390
      run: gitleaks dir . --no-banner --redact

    - name: shfmt
      tags: [base]
      glob:
        - "scripts/*.sh"
      run: shfmt -i 2 -ci -d {staged_files}

    - name: shellcheck
      tags: [base]
      # No zsh exclude (dotfiles has one for false positives) — this repo ships
      # no zsh. .envrc* carry `# shellcheck shell=bash` since they lack a shebang.
      glob:
        - "scripts/*.sh"
        - ".envrc"
        - ".envrc.local.example"
      run: shellcheck {staged_files}

    - name: comment-concision
      tags: [base]
      glob:
        - "scripts/*.sh"
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - "lefthook.yml"
      run: scripts/check-comment-concision.sh {staged_files}

    - name: workflow-secrets
      tags: [base]
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: scripts/check-workflow-secrets.sh {staged_files}

    - name: justfile-format
      tags: [base]
      glob:
        - "justfile"
      # --justfile, not positional (`just` reads a positional as a recipe name).
      # --fmt --check validates syntax + canonical formatting in one pass.
      run: just --fmt --check --justfile {staged_files}

    - name: editorconfig-checker
      tags: [base]
      glob:
        - "*"
        - "**/*"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      # --disable-indentation: indentation stays each per-language formatter's
      # job. Excludes match the markdown jobs' (CHANGELOG.md is git-cliff generated).
      run: editorconfig-checker --disable-indentation {staged_files}

    - name: envrc-local-example-sync
      tags: [base]
      run: scripts/check-envrc-local-example.sh

    # Not tagged `base`: specific to this repo hosting the templates, not
    # part of a generated repo's own `just lint --tag base`.
    - name: j2lint
      glob:
        - "git-flow/template/**"
        - "python/template/**"
        - "typescript/template/**"
      run: scripts/lint-templates.sh --jinja {staged_files}

    # Unit tests for the vendored advisory-reviewer script (#60) — specific
    # to hosting the payload, not part of a generated repo's own lint.
    - name: pr-review-test
      glob:
        - "git-flow/template/scripts/pr-review/**"
      run: node --test "git-flow/template/scripts/pr-review/*.test.mjs"

pre-push:
  jobs:
    - name: envrc-local-example-sync
      tags: [base]
      run: scripts/check-envrc-local-example.sh

    # Heavier (full copier render + rendered lefthook run per template), so
    # pre-push not pre-commit; CI runs the same `just lint-templates` entry point.
    - name: lint-templates
      glob:
        - "git-flow/**"
        - "python/**"
        - "typescript/**"
      run: just lint-templates

    - name: governance-propagation
      # No glob: the script computes its own whole-branch diff scope
      # (origin/main...HEAD), like envrc-local-example-sync above.
      run: scripts/check-governance-propagation.sh
