# This repo's own lefthook jobs — not the templates it hosts. A single
# file: unlike git-flow/template's base/lang split (the real composition
# mechanism a *generated* repo needs to layer a language overlay without
# editing the base), this repo has no overlay of its own to compose with,
# so the split bought nothing here — it was just an artifact of
# bootstrapping from the git-flow base (#10). The `base` tag stays on every
# job below since lint.yml's CI job selects it via `just lint --tag base`.
# Install with `lefthook install`.
pre-commit:
  jobs:
    - name: actionlint
      tags: [base]
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: actionlint {staged_files}

    - name: md-format
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: prettier --check {staged_files}

    - name: markdownlint
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: markdownlint-cli2 {staged_files}

    - name: yaml-format
      tags: [base]
      glob:
        - ".github/dependabot.yml"
        - ".markdownlint-cli2.yaml"
        - "lefthook.yml"
      run: yamlfmt -lint {staged_files}

    - name: gitleaks
      tags: [base]
      # No glob, no {staged_files}: gitleaks is content-based, not
      # file-type-gated, and must cover .claude/agent-memory/** (the
      # committed agent-memory store's secrets floor) — never copy the
      # markdown jobs' exclude list here. Whole-tree dir scan rather than
      # --staged so the same invocation is meaningful under CI's
      # `lefthook run pre-commit --all-files`, where nothing is staged.
      # Allowlist lives in .gitleaks.toml. Lineage: dotfiles#390.
      run: gitleaks dir . --no-banner --redact

    - name: shfmt
      tags: [base]
      glob:
        - "scripts/*.sh"
      run: shfmt -i 2 -ci -d {staged_files}

    - name: shellcheck
      tags: [base]
      # No zsh exclude here (dotfiles' shellcheck excludes zsh for false
      # positives) — this repo ships no zsh, so that exclude doesn't
      # travel. .envrc/.envrc.local.example carry `# shellcheck shell=bash`
      # directives since they have no shebang of their own.
      glob:
        - "scripts/*.sh"
        - ".envrc"
        - ".envrc.local.example"
      run: shellcheck {staged_files}

    - name: comment-concision
      tags: [base]
      glob:
        - "scripts/*.sh"
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
        - "lefthook.yml"
      run: scripts/check-comment-concision.sh {staged_files}

    - name: justfile-format
      tags: [base]
      glob:
        - "justfile"
      # --justfile (not a positional, which `just` reads as a recipe name)
      # takes exactly one path. --fmt --check validates syntax (it must
      # parse to format) and canonical formatting in one pass. Lineage:
      # dotfiles' justfile-format job.
      run: just --fmt --check --justfile {staged_files}

    - name: editorconfig-checker
      tags: [base]
      glob:
        - "*"
        - "**/*"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      # The catch-all for files no dedicated formatter covers. Indent checks
      # are off (--disable-indentation): indentation stays each
      # per-language formatter's job (shfmt/prettier/yamlfmt), which
      # understands its own syntax — see dotfiles' inline comment for the
      # full why. Excludes match the markdown jobs' (CHANGELOG.md is
      # git-cliff generated once release automation is used;
      # .claude/agent-memory/** is the committed agent-memory store) —
      # dotfiles' theme/zellij vendored-content excludes don't travel here.
      run: editorconfig-checker --disable-indentation {staged_files}

    - name: envrc-local-example-sync
      tags: [base]
      run: scripts/check-envrc-local-example.sh

    # Raw jinja syntax check on the copier templates this repo hosts — cheap,
    # catches broken jinja before render. Not tagged `base`: this job is
    # specific to this repo hosting the templates, not part of what a
    # generated repo's own `just lint --tag base` runs. Filtering (extension,
    # two known j2lint-false-positive files) lives in the script; see its
    # header for why.
    - name: j2lint
      glob:
        - "git-flow/template/**"
        - "python/template/**"
      run: scripts/lint-templates.sh --jinja {staged_files}

pre-push:
  jobs:
    - name: envrc-local-example-sync
      tags: [base]
      run: scripts/check-envrc-local-example.sh

    # Render-then-verify — heavier (a full copier render + rendered
    # lefthook run per template), so pre-push rather than pre-commit; CI
    # runs the same `just lint-templates` entry point (lint-templates.yml).
    - name: lint-templates
      glob:
        - "git-flow/**"
        - "python/**"
      run: just lint-templates

    - name: governance-propagation
      # No glob: the script computes its own whole-branch diff scope
      # (origin/main...HEAD), like envrc-local-example-sync above.
      run: scripts/check-governance-propagation.sh
