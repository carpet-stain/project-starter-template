name: PR code review (advisory)

# Advisory only, never a required check (an LLM reviewer false-positives).
# Vendored from dotfiles' current scripts/pr-review/ — see #155 for why.

on:
  pull_request:
    types: [opened, synchronize, labeled]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      # A role-assume failure falls through to the guard step below rather
      # than failing the job; skipped outright when the var is unset.
      - name: Assume the OpenRouter key read role via OIDC
        id: aws-creds
        if: vars.AWS_OPENROUTER_ROLE_ARN != ''
        continue-on-error: true
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_OPENROUTER_ROLE_ARN }}
          aws-region: us-east-1
      - name: Fetch the review API key from SSM
        id: guard
        run: |
          # Unset var: no key configured, skip by design — quiet. Var set but
          # the assume/fetch below failed: a genuine credential gap — shout.
          if [ -z "${{ vars.AWS_OPENROUTER_ROLE_ARN }}" ]; then
            echo "AWS_OPENROUTER_ROLE_ARN not set — advisory review skipped by design."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${{ steps.aws-creds.outcome }}" != "success" ]; then
            echo "::warning::OIDC role assume failed — advisory review skipped."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          key="$(aws ssm get-parameter --name /runtime/openrouter-api-key --with-decryption --query Parameter.Value --output text 2>&1)"
          status=$?
          set -e
          if [ "$status" -ne 0 ] || [ -z "$key" ]; then
            echo "::warning::openrouter-api-key SSM fetch failed — advisory review skipped."
            echo "enabled=false" >>"$GITHUB_OUTPUT"
          else
            echo "::add-mask::$key"
            echo "OPENAI_API_KEY=$key" >>"$GITHUB_ENV"
            echo "enabled=true" >>"$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v7
        if: steps.guard.outputs.enabled == 'true'
      - uses: actions/setup-node@v4
        if: steps.guard.outputs.enabled == 'true'
        with:
          node-version: "20"
      - name: Advisory review
        if: steps.guard.outputs.enabled == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # OPENAI_API_KEY rides $GITHUB_ENV from the guard step above (SSM),
          # not a secrets.* reference.
          OPENAI_API_URL: https://openrouter.ai/api/v1/chat/completions
          OPENAI_MODEL: openai/gpt-5.6-sol
          PR_NUMBER: ${{ github.event.pull_request.number }}
          # Only set on pull_request_review_comment; harmlessly empty on the
          # pull_request-triggered diff-review path.
          COMMENT_ID: ${{ github.event.comment.id }}
        run: node scripts/pr-review/run.mjs
