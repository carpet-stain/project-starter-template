name: Lint templates

# Render-then-verify for the copier templates this repo hosts (git-flow
# base, python overlay) — see scripts/lint-templates.sh's own header for the
# strategy. Separate workflow from lint.yml: the script now runs each
# render's own `lefthook run pre-commit/pre-push --all-files`, so this job's
# toolchain mirrors git-flow/template/.github/workflows/lint.yml.jinja's own
# install steps (plus uv/taplo, which that workflow doesn't need) — a tool a
# rendered lefthook job requires but this job doesn't provision fails here,
# not in a consumer (project-starter-template#41).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: lint-templates-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-templates:
    name: lint-templates
    runs-on: ubuntu-latest
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v7

      # Provides `uv`/`uvx` — renders the templates (copier) and runs the
      # raw jinja check (j2lint); the python overlay render's own
      # ruff/pyright come from its own `uv sync`, not a separate install.
      - uses: astral-sh/setup-uv@v7

      - uses: extractions/setup-just@v4

      - name: Install actionlint, yamlfmt, taplo
        env:
          ACTIONLINT_VERSION: "1.7.12"
          YAMLFMT_VERSION: "0.21.0"
          TAPLO_VERSION: "0.10.0"
        run: |
          curl -fsSL "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin actionlint
          curl -fsSL "https://github.com/google/yamlfmt/releases/download/v${YAMLFMT_VERSION}/yamlfmt_${YAMLFMT_VERSION}_Linux_x86_64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin yamlfmt
          curl -fsSL "https://github.com/tamasfe/taplo/releases/download/${TAPLO_VERSION}/taplo-linux-x86_64.gz" \
            | gunzip | sudo tee /usr/local/bin/taplo >/dev/null
          sudo chmod +x /usr/local/bin/taplo

      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Install Node lint tools
        run: npm install --global lefthook markdownlint-cli2 prettier

      # Same tools, same pinned versions, as
      # git-flow/template/.github/workflows/lint.yml.jinja's own install
      # steps — kept in sync by hand (the same doubled-list cost #27 already
      # accepted for the shipped payload vs. this repo's live copy).
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: "8.30.1"
        run: |
          curl -fsSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Install shfmt and shellcheck
        env:
          SHFMT_VERSION: "3.13.1"
          SHELLCHECK_VERSION: "0.11.0"
        run: |
          curl -fsSL "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64" \
            -o /tmp/shfmt && sudo install -m 755 /tmp/shfmt /usr/local/bin/shfmt
          curl -fsSL "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz" \
            | sudo tar -xJ -C /usr/local/bin --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"

      - name: Install editorconfig-checker
        env:
          EDITORCONFIG_CHECKER_VERSION: "3.8.0"
        run: |
          curl -fsSL "https://github.com/editorconfig-checker/editorconfig-checker/releases/download/v${EDITORCONFIG_CHECKER_VERSION}/ec-linux-amd64.tar.gz" \
            | tar -xz -O bin/ec-linux-amd64 | sudo tee /usr/local/bin/editorconfig-checker > /dev/null
          sudo chmod +x /usr/local/bin/editorconfig-checker

      - name: Run copier-template render-and-verify checks
        run: just lint-templates
