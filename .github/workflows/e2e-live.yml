name: Live e2e (template-e2e)

# Dispatch-triggered live exercise of the git-flow payload against
# carpet-stain/template-e2e, a permanent sandbox provisioned by infra's
# repos.tf. #41/lint-templates.yml verify the rendered output locally
# (copier render + the rendered repo's own lefthook checks); this verifies
# it against actual live GitHub behavior — branch rulesets really enforcing
# what they declare, the draft-PR gate's job-level `if:` actually staying
# quiet until ready, a real rebase-merge, a real branch deletion. Design:
# project-starter-template#42's decision comment. Part of epic #47.

# Auth: template-e2e is a different repo than this one, so the ambient
# `github.token` (scoped to this repo only) can't reach it. Assumes infra's
# `project-starter-template-e2e-read` OIDC role and reads the infra-vended
# cross-repo token from SSM instead (docs/CONSUMING-SECRETS.md's "CI"
# recipe, infra's ADR-0010, infra#147) — the same token a local/agent shell
# reads, scoped to {contents, issues, pull_requests, actions}: write +
# checks: read over template-e2e (infra PR #134/#135). Needs one thing
# provisioned by a human in this repo's own Settings (never self-service —
# the trust boundary is the OIDC role's sub condition, applied only via
# infra's `just tofu-iam` with its bootstrap key, so an agent can't
# provision this itself): a variable `AWS_VEND_READ_ROLE_ARN` (the role's
# ARN, non-secret).
on:
  workflow_dispatch:

concurrency:
  group: e2e-live
  # Never cancel a run mid-flight: it may already be mid-merge against the
  # sandbox, and a cancelled run's own branch/PR is exactly what #50's
  # crash-cleanup preamble exists to sweep up on the *next* run, not what a
  # cancellation should race against.
  cancel-in-progress: false

env:
  E2E_REPO: carpet-stain/template-e2e
  BRANCH: e2e/${{ github.run_id }}

jobs:
  e2e:
    name: live e2e
    runs-on: ubuntu-latest
    # id-token: write is the OIDC assertion this job needs to assume
    # infra's project-starter-template-e2e-read role, job-scoped per
    # infra's ADR-0010 step 5 (infra#147) — the ambient github.token stays
    # unused: every GitHub API call in this job goes through the vended
    # cross-repo token below.
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # copier's own post-gen task list (_tasks in copier.yml) runs
      # `lefthook install` -- needs the binary present regardless of
      # whether this workflow ever runs a lefthook check itself.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --global lefthook

      - name: Assume project-starter-template-e2e-read via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_VEND_READ_ROLE_ARN }}
          aws-region: us-east-1

      # Mirrors infra's vend-token.yml inline single-parameter read: masked
      # before it ever lands in GITHUB_OUTPUT, multiline-safe delimiter
      # (the value is a JSON blob, not guaranteed single-line-safe).
      - name: Read vended token from SSM
        id: ssm
        run: |
          value="$(aws ssm get-parameter --name /runtime/vended-token \
            --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$value"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "VENDED<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >>"$GITHUB_OUTPUT"

      - name: Extract token
        id: token
        env:
          VENDED: ${{ steps.ssm.outputs.VENDED }}
        run: |
          token=$(jq -r '.token // empty' <<<"$VENDED")
          if [ -z "$token" ]; then
            echo "::error::vended token parameter had no .token field — check vend-token.yml's publish shape" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Crash-cleanup preamble (#50)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/e2e-cleanup-stale.sh

      - name: Render git-flow payload
        run: |
          uvx copier copy --trust --defaults \
            -d github_owner=carpet-stain -d github_repo=template-e2e \
            git-flow "$RUNNER_TEMP/render"

      # One commit per run, pushed as a fresh branch off the sandbox's
      # current main — mirrors the real bootstrap/re-render flow a
      # consumer actually goes through (git-flow/README.md's runbook),
      # not a synthetic shortcut. rsync --delete so a file the render no
      # longer produces is actually removed, not just left stale.
      - name: Push render as a new branch
        id: push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # --branch main, not whatever the repo's default branch happens to
          # be set to (they can diverge — e.g. a stale leftover branch left
          # as default from a prior manual test) — this workflow's PR always
          # targets main explicitly below, so the branch it forks from must
          # match, not just whatever `git clone` defaults to.
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${E2E_REPO}.git" "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          git checkout -b "$BRANCH"
          rsync -a --delete --exclude .git "$RUNNER_TEMP/render/" ./
          git add -A
          # A render identical to main's current content is a legitimate,
          # common outcome (nothing in the template changed since the last
          # run) — not a failure. Skip the rest of the cycle rather than
          # opening a no-op PR against nothing.
          if git diff --cached --quiet; then
            echo "no changes since main's current render — nothing to verify this run"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Synthetic committer identity — template-e2e is a disposable,
          # per-run-discarded sandbox with no external audience, so
          # verified-bot attribution isn't worth chasing here.
          git -c user.name="project-starter-template e2e" -c user.email="e2e@users.noreply.github.com" \
            commit -m "chore: e2e render $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$BRANCH"

      - name: Open draft PR
        id: pr
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          body=$'Automated live-e2e run — carpet-stain/project-starter-template#48, run ${{ github.run_id }}.\n\nNo-Issue: automated e2e sandbox run, not a tracked change.'
          gh pr create -R "$E2E_REPO" --draft --head "$BRANCH" --base main \
            --title "chore: e2e render $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "$body"
          number=$(gh pr view "$BRANCH" -R "$E2E_REPO" --json number -q .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The one thing tier 1 (#41) structurally cannot exercise: pr-guards.yml
      # and adr-guard.yml's job-level `if: draft == false` actually gating
      # the three required checks, not a workflow-level skip that would read
      # as passing to branch-protection instead (dotfiles' github.md edge
      # case). `--required` matches template-e2e's ruleset exactly: single
      # commit, conventional commit, adr guard (no extra_required_checks).
      - name: Assert draft-gate stays quiet
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # gh pr checks --watch treats zero checks reported as terminal, not
          # pending — it doesn't wait for GitHub to even schedule the
          # pr-guards.yml/adr-guard.yml runs in the first place (a few
          # seconds of webhook/queueing lag right after PR creation).
          # Confirmed live: querying immediately after `gh pr create` hit
          # "no checks reported" outright. Poll by hand instead.
          checks="[]"
          for _ in $(seq 1 24); do
            if out=$(gh pr checks "${{ steps.pr.outputs.number }}" -R "$E2E_REPO" --required --json name,bucket 2>/dev/null) \
              && [ "$(jq 'length' <<<"$out")" -ge 3 ]; then
              checks="$out"
              break
            fi
            sleep 5
          done
          echo "$checks" | jq .
          count=$(jq 'length' <<<"$checks")
          not_skipping=$(jq '[.[] | select(.bucket != "skipping")] | length' <<<"$checks")
          if [ "$count" -ne 3 ] || [ "$not_skipping" -ne 0 ]; then
            echo "::error::draft-gate regression — expected exactly 3 required checks, all 'skipping', while draft" >&2
            exit 1
          fi

      - name: Flip PR ready
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr ready "${{ steps.pr.outputs.number }}" -R "$E2E_REPO"

      - name: Poll for green required checks
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: timeout 600 gh pr checks "${{ steps.pr.outputs.number }}" -R "$E2E_REPO" --watch --required --fail-fast

      - name: Rebase-merge
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # A brief consistency lag between the Checks API (what the prior
          # poll queried) and the ruleset engine's own merge-eligibility
          # evaluation — confirmed live: merge was rejected immediately
          # after a clean --fail-fast poll with "3 of 3 required status
          # checks are queued", even though gh pr checks had just reported
          # them all passing.
          for _ in $(seq 1 6); do
            gh pr merge "${{ steps.pr.outputs.number }}" -R "$E2E_REPO" --rebase && exit 0
            sleep 5
          done
          echo "::error::rebase-merge still rejected after retrying — not just the ruleset-lag case" >&2
          exit 1

      # delete_branch_on_merge (main.tf, repo-wide) should have swept the
      # branch already; confirm it actually fired rather than trusting Tofu
      # state.
      - name: Assert branch deleted post-merge
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          for _ in $(seq 1 12); do
            gh api "repos/$E2E_REPO/branches/$BRANCH" >/dev/null 2>&1 || exit 0
            sleep 5
          done
          echo "::error::branch $BRANCH still exists 60s after merge — delete_branch_on_merge did not fire" >&2
          exit 1
