name: Live e2e (template-e2e)

# Live counterpart to #41: proves rulesets, the draft-gate, rebase-merge,
# and branch deletion actually work against real GitHub. See #42, epic #47.

# ambient github.token can't reach template-e2e (a different repo) — uses
# infra's vended cross-repo token instead (infra ADR-0010, infra#147).
on:
  workflow_dispatch:

concurrency:
  group: e2e-live
  # Never cancel mid-flight — it may be mid-merge; #50's crash-cleanup
  # preamble sweeps up an aborted run's branch/PR on the *next* run.
  cancel-in-progress: false

env:
  E2E_REPO: carpet-stain/template-e2e
  BRANCH: e2e/${{ github.run_id }}

jobs:
  e2e:
    name: live e2e
    runs-on: ubuntu-latest
    # OIDC assertion to assume infra's project-starter-template-e2e-read
    # role, job-scoped per infra ADR-0010 step 5 (infra#147).
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7

      # copier's post-gen tasks run `lefthook install` — needs the binary
      # present even though this job runs no lefthook check itself.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --global lefthook

      - name: Assume project-starter-template-e2e-read via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_VEND_READ_ROLE_ARN }}
          aws-region: us-east-1

      # Mirrors infra's vend-token.yml: masked before GITHUB_OUTPUT, with a
      # multiline-safe delimiter since the value is a JSON blob.
      - name: Read vended token from SSM
        id: ssm
        run: |
          value="$(aws ssm get-parameter --name /runtime/vended-token \
            --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$value"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "VENDED<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >>"$GITHUB_OUTPUT"

      - name: Extract token
        id: token
        env:
          VENDED: ${{ steps.ssm.outputs.VENDED }}
        run: |
          token=$(jq -r '.token // empty' <<<"$VENDED")
          if [ -z "$token" ]; then
            echo "::error::vended token parameter had no .token field — check vend-token.yml's publish shape" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Crash-cleanup preamble (#50)
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: scripts/e2e-cleanup-stale.sh

      - name: Render git-flow payload
        run: |
          uvx copier copy --trust --defaults \
            -d github_owner=carpet-stain -d github_repo=template-e2e \
            git-flow "$RUNNER_TEMP/render"

      # Mirrors the real consumer re-render flow (git-flow/README.md's
      # runbook); rsync --delete removes files the render no longer produces.
      - name: Push render as a new branch
        id: push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # --branch main explicitly — the repo's default branch can diverge
          # (e.g. stale leftover from a prior manual test); PR below targets main.
          git clone --branch main "https://x-access-token:${GH_TOKEN}@github.com/${E2E_REPO}.git" "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          git checkout -b "$BRANCH"
          rsync -a --delete --exclude .git "$RUNNER_TEMP/render/" ./
          git add -A
          # Identical render is a legitimate, common outcome (nothing
          # changed since last run) — skip rather than open a no-op PR.
          if git diff --cached --quiet; then
            echo "no changes since main's current render — nothing to verify this run"
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # Synthetic committer identity — template-e2e is a disposable,
          # audience-less sandbox; verified-bot attribution isn't worth chasing.
          git -c user.name="project-starter-template e2e" -c user.email="e2e@users.noreply.github.com" \
            commit -m "chore: e2e render $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push origin "$BRANCH"

      - name: Open draft PR
        id: pr
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          body=$'Automated live-e2e run — carpet-stain/project-starter-template#48, run ${{ github.run_id }}.\n\nNo-Issue: automated e2e sandbox run, not a tracked change.'
          gh pr create -R "$E2E_REPO" --draft --head "$BRANCH" --base main \
            --title "chore: e2e render $(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --body "$body"
          number=$(gh pr view "$BRANCH" -R "$E2E_REPO" --json number -q .number)
          echo "number=$number" >> "$GITHUB_OUTPUT"

      # The one thing #41 can't exercise: the draft-gate `if:` actually
      # gating required checks live (dotfiles github.md's edge case).
      - name: Assert draft-gate stays quiet
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # gh pr checks --watch treats zero checks as terminal, not
          # pending (confirmed live) — poll by hand instead.
          checks="[]"
          for _ in $(seq 1 24); do
            if out=$(gh pr checks "${{ steps.pr.outputs.number }}" -R "$E2E_REPO" --required --json name,bucket 2>/dev/null) \
              && [ "$(jq 'length' <<<"$out")" -ge 3 ]; then
              checks="$out"
              break
            fi
            sleep 5
          done
          echo "$checks" | jq .
          count=$(jq 'length' <<<"$checks")
          not_skipping=$(jq '[.[] | select(.bucket != "skipping")] | length' <<<"$checks")
          if [ "$count" -ne 3 ] || [ "$not_skipping" -ne 0 ]; then
            echo "::error::draft-gate regression — expected exactly 3 required checks, all 'skipping', while draft" >&2
            exit 1
          fi

      - name: Flip PR ready
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh pr ready "${{ steps.pr.outputs.number }}" -R "$E2E_REPO"

      - name: Poll for green required checks
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: timeout 600 gh pr checks "${{ steps.pr.outputs.number }}" -R "$E2E_REPO" --watch --required --fail-fast

      - name: Rebase-merge
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          # Brief lag between the Checks API and the ruleset's own merge
          # check — confirmed live to reject right after a clean poll.
          for _ in $(seq 1 6); do
            gh pr merge "${{ steps.pr.outputs.number }}" -R "$E2E_REPO" --rebase && exit 0
            sleep 5
          done
          echo "::error::rebase-merge still rejected after retrying — not just the ruleset-lag case" >&2
          exit 1

      # delete_branch_on_merge (main.tf) should already have swept this —
      # confirm it fired rather than trusting Tofu state.
      - name: Assert branch deleted post-merge
        if: steps.push.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          for _ in $(seq 1 12); do
            gh api "repos/$E2E_REPO/branches/$BRANCH" >/dev/null 2>&1 || exit 0
            sleep 5
          done
          echo "::error::branch $BRANCH still exists 60s after merge — delete_branch_on_merge did not fire" >&2
          exit 1
