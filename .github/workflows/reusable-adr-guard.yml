name: Reusable ADR guard

# Fleet single copy; thin callers pin the moving major (ADR-0004, #104, #110).
# Caller contract = job `name:`s + inputs — breaking cuts v2, compatible rides v1.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  adr-guard:
    name: adr guard
    runs-on: ubuntu-latest
    # Draft gate lives HERE, never on the caller `uses:` job — a skipped
    # caller never expands this workflow and its required check hangs (#104).
    if: github.event.pull_request.draft == false
    steps:
      # Unconditional: the spelling guard below needs the tree on every PR,
      # not just architecture-labeled ones.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0

      # Step condition, not job-level `if:` — a required check must always
      # report a conclusion; skipped sits pending forever and blocks merge.
      - name: Require a docs/adr/ touch on architecture-labeled PRs
        if: contains(github.event.pull_request.labels.*.name, 'architecture')
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          # Three-dot: diff from the merge-base, so only files this PR changed
          # count — not files the base branch changed after the PR forked.
          if git diff --name-only "$BASE"...HEAD | grep -q '^docs/adr/'; then
            echo "architecture-labeled PR touches docs/adr/ — ok."
          else
            echo "::error::PR is labeled 'architecture' but adds/modifies no docs/adr/ file. Record the decision as an ADR (see docs/adr/README.md) before merge."
            exit 1
          fi

      - name: Reject the Superceded misspelling
        # adr-tools' own template writes this misspelling (#124) — catch any
        # occurrence, however it got in, not just ones from that one tool.
        run: |
          if grep -rl 'Superceded' docs/adr/ 2>/dev/null; then
            echo "::error::docs/adr/ contains the misspelling 'Superceded' — use 'Superseded by NNNN' (see docs/adr/README.md § Superseding)."
            exit 1
          fi

      # Unconditional, like the misspelling check above (#123). Inline, not
      # scripts/: only this YAML travels with the `uses:` pin to callers.
      - name: Cap ADR Decision length at 500 words
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          cap=500
          status=0
          while IFS= read -r file; do
            [[ -f "$file" ]] || continue

            # Decision section: from "## Decision" to the next "## " heading or EOF.
            section=$(awk '
              /^## Decision[ \t]*$/ { inside = 1; next }
              /^## / { inside = 0 }
              inside { print }
            ' "$file")
            [[ -n "$section" ]] || continue

            # Code blocks and table rows aren't prose — strip both before counting.
            prose=$(printf '%s\n' "$section" | awk '
              /^```/ { infence = !infence; next }
              infence { next }
              /^[ \t]*\|/ { next }
              { print }
            ')

            count=$(printf '%s' "$prose" | wc -w | tr -d ' ')
            (( count <= cap )) && continue

            if grep -qE '^> ?Decision-length override: .+' "$file"; then
              continue
            fi

            echo "::error file=$file::Decision section is $count words, cap is $cap (docs/adr/README.md). Split the decision across two ADRs, or add a visible '> Decision-length override: <reason>' line to earn the overage."
            status=1
          done < <(git diff --name-only --diff-filter=ACM "$BASE"...HEAD -- 'docs/adr/*.md')
          exit "$status"

      - name: Enforce the ADR amendment and supersession markers
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
        run: |
          mapfile -t changed < <(git diff --name-only --diff-filter=ACM "$BASE"...HEAD -- 'docs/adr/*.md')
          is_changed() {
            local target="$1"
            for f in "${changed[@]}"; do
              [[ "$f" == "$target" ]] && return 0
            done
            return 1
          }

          status=0
          # Loops over every match, not just the first — an ADR naming two
          # targets needs both checked (#135).
          check_refs() {
            local file="$1" this_num="$2" status_section="$3"
            local keyword="$4" reciprocal="$5" section="$6"
            local ref target
            while IFS= read -r ref; do
              [[ -n "$ref" ]] || continue
              target=$(find docs/adr -maxdepth 1 -name "${ref}-*.md" | head -n1)

              if [[ -z "$target" ]]; then
                echo "::error file=$file::Status says '$keyword $ref' but no docs/adr/${ref}-*.md exists."
                status=1
                continue
              fi

              if ! is_changed "$target"; then
                echo "::error file=$file::Status says '$keyword $ref' but $target isn't modified in this PR. Set its Status to '$reciprocal $this_num' in the same PR ($section)."
                status=1
              fi
            done < <(printf '%s\n' "$status_section" | grep -oE "${keyword} [0-9]{4}" | awk '{print $2}')
          }

          for file in "${changed[@]}"; do
            [[ -f "$file" ]] || continue
            # Skip non-ADR files (e.g. README.md) — its own doc examples
            # contain literal '## Status' headers the section scan can't tell apart.
            [[ "$(basename "$file")" =~ ^[0-9]{4}- ]] || continue

            status_section=$(awk '
              /^## Status[ \t]*$/ { inside = 1; next }
              /^## / { inside = 0 }
              inside { print }
            ' "$file")

            this_num=$(basename "$file" | grep -oE '^[0-9]{4}')

            check_refs "$file" "$this_num" "$status_section" "Supersedes" "Superseded by" "docs/adr/README.md § Superseding"
            check_refs "$file" "$this_num" "$status_section" "Amends" "Amended by" "docs/adr/README.md § Amending a clause"
          done
          exit "$status"
