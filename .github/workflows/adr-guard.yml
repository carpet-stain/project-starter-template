name: ADR guard

# Thin caller — the guard body lives in reusable-adr-guard.yml (ADR-0004).
# Same-repo local `uses:` runs this commit's copy; consumers pin a SHA.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: adr-guard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id `guards` is ruleset contract: the required context is
  # `guards / adr guard` — renaming this id breaks the ruleset (#104).
  guards:
    uses: ./.github/workflows/reusable-adr-guard.yml
