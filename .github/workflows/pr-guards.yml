name: PR guards

# Thin caller — the guard bodies live in reusable-pr-guards.yml (ADR-0004).
# Same-repo local `uses:` runs this commit's copy; consumers pin a SHA.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: pr-guards-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id `guards` is ruleset contract: required contexts are
  # `guards / single commit` etc. — renaming this id breaks the ruleset (#104).
  guards:
    uses: ./.github/workflows/reusable-pr-guards.yml
