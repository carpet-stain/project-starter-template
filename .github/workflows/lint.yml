name: Lint

# Thin caller — the lint body lives in reusable-lint.yml (ADR-0004).
# Same-repo local `uses:` runs this commit's copy; consumers pin `@v1` (#110).
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: ["main"]

permissions:
  contents: read

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Job id `guards` matches the other callers; context: `guards / lint` (#104).
  guards:
    uses: ./.github/workflows/reusable-lint.yml
