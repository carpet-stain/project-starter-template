name: Bootstrap e2e sandbox main

# One-time/disaster-recovery seeding of template-e2e's main — e2e-live.yml
# (#48) assumes main already exists; this is what makes that true.

# Rename workaround from git-flow/README.md's bootstrap runbook: direct
# push to main is rejected by the ruleset (GH013, no required checks yet).
on:
  workflow_dispatch:

jobs:
  bootstrap:
    name: seed main
    runs-on: ubuntu-latest
    # OIDC assertion to assume infra's project-starter-template-e2e-read
    # role, job-scoped per infra ADR-0010 step 5 (infra#147).
    permissions:
      id-token: write
    env:
      E2E_REPO: carpet-stain/template-e2e
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v7

      # copier's post-gen tasks run `lefthook install` — needs the binary
      # present even though this job runs no lefthook check itself.
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm install --global lefthook

      - name: Assume project-starter-template-e2e-read via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_VEND_READ_ROLE_ARN }}
          aws-region: us-east-1

      # Mirrors infra's vend-token.yml: masked before GITHUB_OUTPUT, with a
      # multiline-safe delimiter since the value is a JSON blob.
      - name: Read vended token from SSM
        id: ssm
        run: |
          value="$(aws ssm get-parameter --name /runtime/vended-token \
            --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$value"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "VENDED<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >>"$GITHUB_OUTPUT"

      - name: Extract token
        id: token
        env:
          VENDED: ${{ steps.ssm.outputs.VENDED }}
        run: |
          token=$(jq -r '.token // empty' <<<"$VENDED")
          if [ -z "$token" ]; then
            echo "::error::vended secret had no .token field" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Refuse to run if main already exists
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          if gh api "repos/$E2E_REPO/branches/main" >/dev/null 2>&1; then
            echo "::error::main already exists on $E2E_REPO — this workflow is first-time-seeding only, refusing to overwrite" >&2
            exit 1
          fi

      - name: Render git-flow payload
        run: |
          uvx copier copy --trust --defaults \
            -d github_owner=carpet-stain -d github_repo=template-e2e \
            git-flow "$RUNNER_TEMP/render"

      - name: Push render and rename to main
        id: push
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/${E2E_REPO}.git" "$RUNNER_TEMP/e2e"
          cd "$RUNNER_TEMP/e2e"
          old_default=$(git symbolic-ref --short HEAD)
          echo "old_default=$old_default" >> "$GITHUB_OUTPUT"
          git checkout -b e2e-bootstrap-seed
          rsync -a --delete --exclude .git "$RUNNER_TEMP/render/" ./
          git add -A
          git -c user.name="project-starter-template e2e" -c user.email="e2e@users.noreply.github.com" \
            commit -m "chore: bootstrap e2e sandbox main"
          git push origin e2e-bootstrap-seed
          gh api "repos/$E2E_REPO/branches/e2e-bootstrap-seed/rename" -f new_name=main

      - name: Delete the stale prior default branch
        if: steps.push.outputs.old_default != 'main'
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh api "repos/$E2E_REPO/git/refs/heads/${{ steps.push.outputs.old_default }}" -X DELETE
