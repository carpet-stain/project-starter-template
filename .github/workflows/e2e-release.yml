name: Live e2e release exercise (template-e2e)

# Epic #47 (#51): proves release-prepare.yml/release-publish.yml work
# live, unlike #41's local-only render check. Needs #48's e2e-live run first.
on:
  workflow_dispatch:

env:
  E2E_REPO: carpet-stain/template-e2e

jobs:
  release:
    name: live release cycle
    runs-on: ubuntu-latest
    # OIDC assertion to assume infra's project-starter-template-e2e-read
    # role, job-scoped per infra ADR-0010 step 5 (infra#147).
    permissions:
      id-token: write
    steps:
      - name: Assume project-starter-template-e2e-read via OIDC
        uses: aws-actions/configure-aws-credentials@e6de054238d6b7531b4efff3b6587d9aade6a06c # v6.2.3
        with:
          role-to-assume: ${{ vars.AWS_VEND_READ_ROLE_ARN }}
          aws-region: us-east-1

      # Mirrors infra's vend-token.yml: masked before GITHUB_OUTPUT, with a
      # multiline-safe delimiter since the value is a JSON blob.
      - name: Read vended token from SSM
        id: ssm
        run: |
          value="$(aws ssm get-parameter --name /runtime/vended-token \
            --with-decryption --query Parameter.Value --output text)"
          echo "::add-mask::$value"
          delim="EOF_$(od -An -N16 -tx1 /dev/urandom | tr -d ' \n')"
          { echo "VENDED<<${delim}"; printf '%s\n' "$value"; echo "$delim"; } >>"$GITHUB_OUTPUT"

      - name: Extract token
        id: token
        env:
          VENDED: ${{ steps.ssm.outputs.VENDED }}
        run: |
          token=$(jq -r '.token // empty' <<<"$VENDED")
          if [ -z "$token" ]; then
            echo "::error::vended token parameter had no .token field" >&2
            exit 1
          fi
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Dispatch release-prepare.yml
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: gh workflow run release-prepare.yml -R "$E2E_REPO" -f bump=auto

      - name: Wait for the release PR to appear
        id: release_pr
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          for _ in $(seq 1 24); do
            number=$(gh pr list -R "$E2E_REPO" --state open --json number,headRefName \
              --jq '[.[] | select(.headRefName | startswith("release/"))][0].number // empty')
            if [ -n "$number" ]; then
              echo "number=$number" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::no release/* PR appeared within 2 minutes of dispatching release-prepare.yml" >&2
          exit 1

      - name: Verify the release PR touches CHANGELOG.md
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          files=$(gh pr view "${{ steps.release_pr.outputs.number }}" -R "$E2E_REPO" --json files --jq '.files[].path')
          echo "$files"
          echo "$files" | grep -qx CHANGELOG.md || {
            echo "::error::release PR doesn't touch CHANGELOG.md" >&2
            exit 1
          }

      # Same GitHub-side lag e2e-live.yml already found: retry the merge
      # itself, not just the check-poll.
      - name: Poll for green required checks and merge
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          timeout 600 gh pr checks "${{ steps.release_pr.outputs.number }}" -R "$E2E_REPO" --watch --required --fail-fast
          for _ in $(seq 1 6); do
            gh pr merge "${{ steps.release_pr.outputs.number }}" -R "$E2E_REPO" --rebase && exit 0
            sleep 5
          done
          echo "::error::rebase-merge of the release PR failed after retrying" >&2
          exit 1

      # release-publish.yml triggers on the release/* PR's closed+merged
      # event — no separate dispatch; the merge above already kicked it off.
      - name: Wait for a real GitHub Release to appear
        id: release
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          for _ in $(seq 1 24); do
            tag=$(gh release list -R "$E2E_REPO" --limit 1 --json tagName,createdAt \
              --jq 'sort_by(.createdAt) | last | .tagName // empty')
            if [ -n "$tag" ]; then
              echo "tag=$tag" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            sleep 5
          done
          echo "::error::no GitHub Release appeared within 2 minutes of merging the release PR" >&2
          exit 1

      - name: Verify the release's content
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
        run: |
          notes=$(gh release view "${{ steps.release.outputs.tag }}" -R "$E2E_REPO" --json body -q .body)
          echo "$notes"
          if [ -z "$notes" ]; then
            echo "::error::release notes are empty" >&2
            exit 1
          fi
          if grep -qE '\[\[|\{\{' <<<"$notes"; then
            echo "::error::unresolved template delimiter left in release notes" >&2
            exit 1
          fi
