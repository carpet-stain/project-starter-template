# Rung-1 jobs (ADR-0006) — self-contained: every `run:` here only invokes a
# tool already on PATH, never a consumer-local script, so a generated repo's
# lefthook.yml can fetch this file live via `remotes:` pinned to PST's `@v1`
# tag instead of copying it (#146 confirmed live: a script-backed `run:`
# fails `exit 127` under `remotes:` — that's why those jobs live in
# lefthook-base.yml instead). Owned by the git-flow template; a language
# overlay never edits this file. The `base` tag is what lint.yml's CI job
# selects; keep it on every job here.
pre-commit:
  jobs:
    - name: actionlint
      tags: [base]
      glob:
        - ".github/workflows/*.yml"
        - ".github/workflows/*.yaml"
      run: actionlint {staged_files}

    - name: md-format
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: prettier --check {staged_files}

    - name: markdownlint
      tags: [base]
      glob:
        - "*.md"
        - "**/*.md"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      run: markdownlint-cli2 {staged_files}

    - name: yaml-format
      tags: [base]
      glob:
        - ".github/dependabot.yml"
        - ".markdownlint-cli2.yaml"
        - "lefthook.yml"
        - "lefthook-base.yml"
        - "lefthook-lang.yml"
        - "lefthook-remote.yml"
      run: yamlfmt -lint {staged_files}

    - name: gitleaks
      tags: [base]
      # No glob/{staged_files} — content-based scan must cover
      # .claude/agent-memory/**; never add the markdown exclude list here. Lineage: dotfiles#390.
      run: gitleaks dir . --no-banner --redact

    - name: shfmt
      tags: [base]
      glob:
        - "scripts/*.sh"
      run: shfmt -i 2 -ci -d {staged_files}

    - name: shellcheck
      tags: [base]
      # No zsh exclude (dotfiles has one for false positives) — this repo ships no zsh.
      # .envrc/.envrc.local.example carry `# shellcheck shell=bash` since they lack a shebang.
      glob:
        - "scripts/*.sh"
        - ".envrc"
        - ".envrc.local.example"
      run: shellcheck {staged_files}

    - name: justfile-format
      tags: [base]
      glob:
        - "justfile"
        - "justfile.base"
      # --justfile takes exactly one path; this repo has two real justfiles, so
      # xargs -n1 runs the check per file instead of passing both at once.
      run: echo {staged_files} | xargs -n1 just --fmt --check --justfile

    - name: editorconfig-checker
      tags: [base]
      glob:
        - "*"
        - "**/*"
      exclude:
        - "CHANGELOG.md"
        - ".claude/agent-memory/**"
      # --disable-indentation: indentation stays each per-language formatter's
      # job (shfmt/prettier/yamlfmt) — this checker is only the catch-all for the rest.
      run: editorconfig-checker --disable-indentation {staged_files}
