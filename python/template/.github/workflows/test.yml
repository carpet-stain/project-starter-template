name: Test

# Disjoint from the base's lint.yml (ADR-0020) — the overlay's own CI slice.
# Branch hardcoded to main; edit below if this repo's default differs.
on:
  pull_request:
    types: [opened, reopened, synchronize, ready_for_review]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    # Job-level `if:` — a skipped-via-if job reads as passing to
    # required-status-check branch protection, same gate as pr-guards.yml.
    if: github.event.pull_request.draft == false
    steps:
      - uses: actions/checkout@v4
      - name: Set up uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true
      - run: uv sync --locked
      # The same lefthook registry contributors run locally, scoped to the
      # overlay's jobs via their tag — the base workflow runs the base slice.
      - name: Run language lint (lefthook lang slice)
        run: uvx lefthook run pre-commit --all-files --tag lang
      - run: uv run pyright
      - run: uv run pytest
